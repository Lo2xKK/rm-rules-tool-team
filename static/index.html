<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM 规则检索</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div>
      <h1>RM 规则检索</h1>
      <div class="sub">搜索规则内容 · 版本对比 · 检查更新 · 数据源：官方规则手册</div>
    </div>
    <button id="checkBtn" class="check-btn" onclick="doCheckUpdate()">检查更新</button>
  </div>
  <div id="updatePanel" class="update-panel hidden"></div>

  <div id="emptyGuide" class="empty-guide hidden">
    <div class="eg-body">
      <div class="eg-title">规则数据尚未初始化</div>
      <div class="eg-desc" id="egDesc">首次使用需先下载官方规则数据（约 240MB，视网络需几分钟）。下载完成后即可搜索、对比、查看 PDF。</div>
      <button class="eg-btn" id="egBtn" onclick="doFirstDownload()">一键下载规则数据</button>
    </div>
  </div>

  <div class="tabs">
    <button id="tabSearch" class="tab active" onclick="switchTab('search')">搜索</button>
    <button id="tabCompare" class="tab" onclick="switchTab('compare')">版本对比</button>
    <button id="tabSeasonCompare" class="tab" onclick="switchTab('seasonCompare')">赛季对比</button>
    <button id="tabToc" class="tab" onclick="switchTab('toc')">目录</button>
  </div>

  <div id="searchView">
    <div class="search-box">
      <select id="seasonSelect" class="doc-select" title="选择赛季" onchange="onSeasonChange()"></select>
      <select id="searchDoc" class="doc-select" onchange="onDocChange()"></select>
      <div class="ver-select">
        <button class="ver-btn" id="verBtn" onclick="toggleVerPanel()">版本</button>
        <div class="ver-panel hidden" id="verPanel"></div>
      </div>
      <div class="q-wrap">
        <input id="q" placeholder="输入关键词，如：飞镖 发射 限制（空格分隔多词）" autofocus autocomplete="off">
        <div id="searchHistory" class="search-history hidden"></div>
      </div>
      <button onclick="doSearch()">搜索</button>
    </div>
    <div class="quick-tags-row">
      <div class="quick-tags" id="quickTags">
        <span class="quick-label">常用：</span>
        <button class="quick-tag" onclick="quickSearch('飞镖')">飞镖</button>
        <button class="quick-tag" onclick="quickSearch('能量机关')">能量机关</button>
        <button class="quick-tag" onclick="quickSearch('惩罚')">惩罚</button>
        <button class="quick-tag" onclick="quickSearch('申诉')">申诉</button>
        <button class="quick-tag" onclick="quickSearch('基地')">基地</button>
        <button class="quick-tag" onclick="quickSearch('哨兵')">哨兵</button>
        <button class="quick-tag" onclick="quickSearch('英雄')">英雄</button>
        <button class="quick-tag" onclick="quickSearch('增益')">增益</button>
      </div>
      <div class="view-switch" id="searchViewSwitch">
        <button class="view-btn" data-view="card" title="卡片视图" onclick="switchSearchView('card')"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3" width="14" height="12" rx="1.5"/><line x1="4.5" y1="7" x2="13.5" y2="7"/><line x1="4.5" y1="10.5" x2="10" y2="10.5"/></svg></button>
        <button class="view-btn" data-view="group" title="分组视图" onclick="switchSearchView('group')"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2.5" width="14" height="3" rx="0.8"/><rect x="5" y="7.5" width="11" height="3" rx="0.8"/><rect x="5" y="12.5" width="11" height="3" rx="0.8"/></svg></button>
        <button class="view-btn" data-view="table" title="表格视图" onclick="switchSearchView('table')"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2.5" width="14" height="13" rx="1.2"/><line x1="2" y1="7" x2="16" y2="7"/><line x1="2" y1="11.5" x2="16" y2="11.5"/><line x1="7" y1="2.5" x2="7" y2="15.5"/></svg></button>
      </div>
    </div>
    <div id="statsRow" class="hidden" style="margin: 4px 0 12px;">
      <span class="stats" id="stats"></span>
    </div>
    <div id="results"><div class="empty">输入关键词开始搜索，或点击下方常用标签</div></div>
  </div>

  <div id="compareView" class="hidden">
    <div class="cmp-bar">
      <label>赛季</label>
      <select id="cmpSeason" onchange="onSeasonChange()"></select>
      <label>文档</label>
      <select id="cmpDoc" onchange="loadVersions()"></select>
      <label>从</label>
      <select id="cmpFrom"></select>
      <label>到</label>
      <select id="cmpTo"></select>
      <button onclick="doCompare()">对比</button>
    </div>
    <div class="cmp-toolbar">
      <input id="cmpFilter" placeholder="过滤改动条款，如：飞镖（按条款号/标题/内容）" oninput="filterCmpResults()">
      <div class="view-switch" id="compareViewSwitch">
        <button class="view-btn" data-view="card" title="卡片视图" onclick="switchCompareView('card')"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3" width="14" height="12" rx="1.5"/><line x1="4.5" y1="7" x2="13.5" y2="7"/><line x1="4.5" y1="10.5" x2="13.5" y2="10.5"/></svg></button>
        <button class="view-btn" data-view="columns" title="双栏对照" onclick="switchCompareView('columns')"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="3" width="6.5" height="12" rx="1"/><rect x="10" y="3" width="6.5" height="12" rx="1"/></svg></button>
      </div>
    </div>
    <div id="cmpSummary"></div>
    <div id="rnBox"></div>
    <div id="cmpResults"><div class="empty">选择两个版本，点击对比查看改动</div></div>
  </div>

  <div id="seasonCompareView" class="hidden">
    <div class="cmp-bar">
      <label>文档</label>
      <select id="scDoc" onchange="loadScSeasons()"></select>
      <label>从赛季</label>
      <select id="scFromSeason"></select>
      <label>到赛季</label>
      <select id="scToSeason"></select>
      <button onclick="doSeasonCompare()">对比</button>
    </div>
    <div class="cmp-toolbar">
      <input id="scFilter" placeholder="过滤改动条款，如：飞镖（按条款号/标题/内容）" oninput="filterScResults()">
      <div class="view-switch" id="seasonCompareViewSwitch">
        <button class="view-btn" data-view="card" title="卡片视图" onclick="switchCompareView('card')"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3" width="14" height="12" rx="1.5"/><line x1="4.5" y1="7" x2="13.5" y2="7"/><line x1="4.5" y1="10.5" x2="10" y2="10.5"/></svg></button>
        <button class="view-btn" data-view="columns" title="双栏对照" onclick="switchCompareView('columns')"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="3" width="6.5" height="12" rx="1"/><rect x="10" y="3" width="6.5" height="12" rx="1"/></svg></button>
      </div>
    </div>
    <div id="scSummary"></div>
    <div id="scResults"><div class="empty">选择两个赛季，点击对比查看规则差异</div></div>
  </div>

  <div id="tocView" class="hidden">
    <div class="toc-bar">
      <select id="tocSeason" class="doc-select" title="选择赛季" onchange="onTocSeasonChange()"></select>
      <select id="tocDoc" class="doc-select" onchange="loadToc()"></select>
      <div class="toc-jump-wrap">
        <input id="tocJump" placeholder="输入条款号跳转，如 5.4.2" autocomplete="off">
      </div>
    </div>
    <div class="toc-layout">
      <div class="toc-tree" id="tocTree"><div class="empty">选择文档查看目录</div></div>
      <div class="toc-detail" id="tocDetail"><div class="empty">点击左侧目录项查看条款内容</div></div>
    </div>
  </div>
</div>

<div class="pdf-modal hidden" id="pdfModal">
  <div class="pdf-backdrop" onclick="closePdf()"></div>
  <div class="pdf-box">
    <div class="pdf-head">
      <span class="pdf-title" id="pdfTitle">PDF 原文</span>
      <div class="pdf-toolbar">
        <button class="pdf-align" id="pdfAlignBtnL" onclick="alignPdfPages('L')" title="将右侧 PDF 对齐到左侧当前页">对齐到旧版</button>
        <button class="pdf-align" id="pdfAlignBtnR" onclick="alignPdfPages('R')" title="将左侧 PDF 对齐到右侧当前页">对齐到新版</button>
      </div>
      <button class="pdf-close" onclick="closePdf()">&#10005;</button>
    </div>
    <div class="pdf-body pdf-duo">
      <div class="pdf-pane" id="paneL">
        <div class="pane-head">
          <span class="pane-label" id="paneLabelL">旧版</span>
          <div class="pane-nav">
            <button class="pdf-nav" onclick="pdfPrev('L')">上一页</button>
            <span class="pdf-page" id="pdfPageInfoL">- / -</span>
            <button class="pdf-nav" onclick="pdfNext('L')">下一页</button>
          </div>
        </div>
        <div class="pane-canvas" id="paneCanvasL"><canvas id="pdfCanvasL"></canvas></div>
      </div>
      <div class="pdf-pane" id="paneR">
        <div class="pane-head">
          <span class="pane-label" id="paneLabelR">新版</span>
          <div class="pane-nav">
            <button class="pdf-nav" onclick="pdfPrev('R')">上一页</button>
            <span class="pdf-page" id="pdfPageInfoR">- / -</span>
            <button class="pdf-nav" onclick="pdfNext('R')">下一页</button>
          </div>
        </div>
        <div class="pane-canvas" id="paneCanvasR"><canvas id="pdfCanvasR"></canvas></div>
      </div>
    </div>
  </div>
</div>

<script src="/static/pdfjs/pdf.min.js"></script>


<script src="/static/app.js"></script>
</body>
</html>
